name: mog_battle
description: Mog Battle — ИИ оценивает внешность, стиль одежды и их синергию, батл двух фото и советы, как стать лучше.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  image: ^4.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E0B14"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
